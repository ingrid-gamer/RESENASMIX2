name: Frontend CI y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias y cobertura
        run: npm run test:coverage
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Subir cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage
      - name: Subir reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  deploy:
    needs: test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install
      - name: Build producción
        working-directory: frontend
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
