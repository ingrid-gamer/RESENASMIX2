
name: Frontend CI y GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Comprobar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Comprobar archivos de pruebas
        run: |
          echo "Buscando archivos de pruebas..."
          find src -type f \( -name "*.test.js" -o -name "*.test.jsx" \)

      - name: Ejecutar pruebas unitarias
        run: npm run test:run

      - name: Compilar proyecto
        run: npm run build
