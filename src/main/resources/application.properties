spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resenasmix?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:bibliotecaduoc-clave-secreta-jwt-2026-cambiar-en-produccion}
springdoc.enable-hateoas=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.port=${PORT:8083}
server.forward-headers-strategy=framework

logging.level.com.example.resenasmix=INFO

external.api.base-url=${EXTERNAL_API_BASE_URL:https://www.freetogame.com/api/games}
# Health check y observabilidad
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
info.app.name=RESENASMIX2
info.app.description=API de reseñas de videojuegos
info.app.version=1.0.0

# Logs legibles por Railway y plataformas de agregación
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.example.resenasmix=INFO

# CORS: localhost en desarrollo; en despliegue agregar el dominio exacto de Vercel.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# El usuario administrador solo se crea si se proporcionan estas variables de entorno.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:}

# Insertar el catálogo de demostración solo cuando videojuegos esté vacío.
app.seed-catalog=${APP_SEED_CATALOG:true}
