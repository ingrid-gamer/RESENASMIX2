services:
  mysql:
    image: mysql:8.0
    container_name: resenasmix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resenasmix
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: resenasmix-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resenasmix?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-clave-local-de-demostracion-cambiar-antes-de-publicar-2026}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      EXTERNAL_API_BASE_URL: https://www.freetogame.com/api/games
      APP_SEED_CATALOG: true

volumes:
  mysql_data:
