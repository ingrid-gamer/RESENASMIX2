# ─── Base de datos ───────────────────────────────────────────────────────────
# Agregamos createDatabaseIfNotExist=true para que Spring cree la BD si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/resenasmix?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:bibliotecaduoc-clave-secreta-jwt-2026-cambiar-en-produccion}

# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:8083}
server.forward-headers-strategy=framework

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────
springdoc.enable-hateoas=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ─── Actuator (health check para AWS/Railway) ────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
info.app.name=RESENASMIX2
info.app.description=API de reseñas de videojuegos
info.app.version=1.0.0

# ─── Logging (CloudWatch-friendly) ───────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.example.resenasmix=INFO

# ─── API externa (FreeToGame) ────────────────────────────────────────────────
external.api.base-url=${EXTERNAL_API_BASE_URL:https://www.freetogame.com/api/games}

# ─── CORS: agrega el dominio de Amplify/Vercel en producción ─────────────────
# Ejemplo: APP_CORS_ALLOWED_ORIGINS=https://main.d1234abc.amplifyapp.com,https://tu-app.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ─── Inicialización del Administrador ────────────────────────────────────────
# Solo se crea si se proporcionan las variables de entorno; no hardcodear en prod
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:}

# ─── Catálogo de demo ─────────────────────────────────────────────────────────
# Se inserta solo si la tabla videojuegos está vacía
app.seed-catalog=${APP_SEED_CATALOG:true}
